[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysql-audit-ai-agent"
version = "0.3.3"
description = "MySQL schema-change safety review for AI coding agents (MCP server and CLI)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "jimmyjan0824" }]
keywords = ["mysql", "mcp", "migration", "schema-change", "online-ddl", "sql-review", "ai-agent", "claude-code", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "sqlglot>=30",
    "mcp>=2",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pymysql>=1.1"]

[project.urls]
Homepage = "https://github.com/jimmyjan0824/mysql_audit_ai_agent"
Issues = "https://github.com/jimmyjan0824/mysql_audit_ai_agent/issues"

[project.scripts]
mysql-audit = "mysql_audit.cli:main"
mysql-audit-mcp = "mysql_audit.mcp_server:main"
# Same as mysql-audit-mcp, so `uvx mysql-audit-ai-agent` starts the MCP server.
mysql-audit-ai-agent = "mysql_audit.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
