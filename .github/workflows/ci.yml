name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  action:
    # Runs the GitHub Action from this checkout against a migration that must fail the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          paths: tests/action_fixture/*.sql
          changed-only: "false"
          comment: "false"
      - name: The blocking migration failed the check
        run: test "${{ steps.audit.outcome }}" = failure

  mcpb:
    # The release attaches this bundle; build it on every PR so a broken manifest shows up early.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/build_mcpb.sh

  mysql:
    # Checks every rule's judgment against a real server (tests/test_mysql_oracle.py).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mysql-version: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_mysql_oracle.py tests/test_mysql_versions.py

  mysql-versions:
    # Version-dependent judgments (INSTANT support) on older servers.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mysql-version: ["5.7", "8.0.28"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_mysql_versions.py
